<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <!-- Soft Contact Drop Shadow -->
    <radialGradient id="shadow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#802038" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#802038" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan-Blue Cone Gradient -->
    <linearGradient id="cyanConeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33B8FF"/>
      <stop offset="45%" stop-color="#008BE6"/>
      <stop offset="85%" stop-color="#005FA3"/>
      <stop offset="100%" stop-color="#003E6B"/>
    </linearGradient>

    <!-- Pink Soft-Serve Swirl Shading -->
    <radialGradient id="pinkSwirlGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFA8C5"/>
      <stop offset="75%" stop-color="#F76B93"/>
      <stop offset="100%" stop-color="#D43763"/>
    </radialGradient>

    <!-- Second Layer Swirl -->
    <linearGradient id="swirlTierGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB3CC"/>
      <stop offset="50%" stop-color="#FA6992"/>
      <stop offset="100%" stop-color="#BA1D47"/>
    </linearGradient>
  </defs>

  <!-- 1. Contact Drop Shadow -->
  <ellipse cx="100" cy="226" rx="28" ry="7" fill="url(#shadow4)"/>

  <!-- 2. Cyan Waffle Cone -->
  <path d="M 72 136 Q 100 146 128 136 L 102 224 Q 100 227 98 224 Z" fill="url(#cyanConeGrad)"/>
  <!-- Cone Waffle Diagonal Ridges -->
  <g stroke="#004D85" stroke-width="1.2" opacity="0.45" stroke-linecap="round">
    <line x1="78" y1="144" x2="108" y2="200"/>
    <line x1="88" y1="146" x2="114" y2="180"/>
    <line x1="122" y1="144" x2="92" y2="200"/>
    <line x1="112" y1="146" x2="86" y2="180"/>
    <line x1="75" y1="164" x2="103" y2="216"/>
    <line x1="125" y1="164" x2="97" y2="216"/>
  </g>
  <!-- Cone Rim Highlight -->
  <path d="M 72 136 Q 100 146 128 136" stroke="#99DDFF" stroke-width="2.2" fill="none" opacity="0.6"/>

  <!-- 3. Pink Soft-Serve Swirl Layers -->
  <!-- Bottom Swirl Tier -->
  <path d="M 68 138 C 62 120, 78 112, 92 114 C 104 108, 122 108, 130 120 C 138 128, 134 138, 128 140 Q 100 148 68 138 Z" fill="url(#swirlTierGrad)"/>
  <ellipse cx="100" cy="130" rx="32" ry="12" fill="url(#pinkSwirlGrad)"/>

  <!-- Middle Swirl Tier -->
  <path d="M 74 116 C 70 98, 86 90, 100 92 C 114 88, 126 96, 124 110 C 122 120, 108 124, 98 122 C 86 122, 76 120, 74 116 Z" fill="url(#swirlTierGrad)"/>
  <ellipse cx="99" cy="106" rx="24" ry="10" fill="url(#pinkSwirlGrad)"/>

  <!-- Top Swirl Peak -->
  <path d="M 84 94 C 82 78, 96 64, 104 50 C 107 44, 114 42, 113 50 C 112 60, 122 76, 114 90 C 106 98, 92 98, 84 94 Z" fill="url(#swirlTierGrad)"/>
  
  <!-- Swirl Glossy Light Highlights -->
  <path d="M 82 128 Q 96 118 118 124" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 88 104 Q 98 94 112 100" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 98 78 Q 106 64 108 52" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/>
</svg>

