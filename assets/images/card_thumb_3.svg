<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <!-- Soft Ground Contact Shadow -->
    <radialGradient id="shadow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A2663" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4A2663" stop-opacity="0"/>
    </radialGradient>

    <!-- Milkshake Cup Body 3D Cylinder Gradient -->
    <linearGradient id="cupGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2A6C4"/>
      <stop offset="25%" stop-color="#FFA8CB"/>
      <stop offset="60%" stop-color="#FFD6E5"/>
      <stop offset="85%" stop-color="#F7ADC9"/>
      <stop offset="100%" stop-color="#D97E9F"/>
    </linearGradient>

    <!-- Whipped Froth Top Gradient -->
    <radialGradient id="frothGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#F3C4D7"/>
    </radialGradient>

    <!-- Straw Gradient (Vibrant Sky Blue) -->
    <linearGradient id="strawGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1494E6"/>
      <stop offset="45%" stop-color="#6BD5FF"/>
      <stop offset="80%" stop-color="#0E78BA"/>
      <stop offset="100%" stop-color="#085485"/>
    </linearGradient>

    <!-- Cup Rim & Base Rim -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E896B4"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C76F8E"/>
    </linearGradient>
  </defs>

  <!-- 1. Contact Drop Shadow -->
  <ellipse cx="100" cy="216" rx="42" ry="10" fill="url(#shadow3)"/>

  <!-- 2. Drinking Straw (Protruding backwards through top) -->
  <g transform="rotate(-18 100 80)">
    <!-- Back of Straw -->
    <rect x="96" y="24" width="9" height="70" rx="4.5" fill="url(#strawGrad)"/>
    <!-- Angled Bend at Top -->
    <path d="M 96 46 L 82 32 L 87 27 L 102 42 Z" fill="url(#strawGrad)"/>
    <!-- White Straw Pinstripe -->
    <path d="M 99 26 L 99 90" stroke="#FFFFFF" stroke-width="1.2" opacity="0.65" stroke-dasharray="8 6"/>
  </g>

  <!-- 3. Cup Tapered Body -->
  <path d="M 72 108 L 78 210 Q 100 216 122 210 L 128 108 Q 100 114 72 108 Z" fill="url(#cupGrad)"/>

  <!-- Specular 3D Gloss Sheen on Cup -->
  <path d="M 92 110 L 95 208 Q 99 209 101 208 L 98 110 Q 95 109 92 110 Z" fill="#FFFFFF" opacity="0.45"/>

  <!-- Cup Bottom Rim -->
  <path d="M 78 210 Q 100 216 122 210 Q 100 206 78 210 Z" fill="url(#rimGrad)" opacity="0.7"/>

  <!-- 4. Whipped Cream / Frothy Dome -->
  <!-- Main Foam Cloud -->
  <path d="M 68 108 C 65 92, 80 82, 92 84 C 98 72, 114 72, 122 84 C 132 82, 142 94, 132 108 Q 100 115 68 108 Z" fill="url(#frothGrad)"/>

  <!-- Cream Swirl Highlights -->
  <path d="M 80 98 Q 95 86 112 92" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 94 82 Q 104 74 116 80" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Cup Lip / Ring Divider -->
  <ellipse cx="100" cy="108" rx="29" ry="5.5" stroke="url(#rimGrad)" stroke-width="2.2" fill="none" opacity="0.7"/>

  <!-- Cute Sprinkles or Floating Bubble Accent -->
  <circle cx="86" cy="94" r="2.2" fill="#FF5E8E"/>
  <circle cx="118" cy="92" r="2.2" fill="#1494E6"/>
  <circle cx="104" cy="90" r="1.8" fill="#FFD13B"/>
</svg>

