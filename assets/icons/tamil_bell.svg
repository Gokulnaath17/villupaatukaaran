<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 360" width="100%" height="100%">
  <defs>
    <!-- Exact Golden Amber Gradients from the Picture -->
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C28212" />
      <stop offset="50%" stop-color="#FFDD7A" />
      <stop offset="100%" stop-color="#8A5600" />
    </linearGradient>

    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#804E00" />
      <stop offset="15%" stop-color="#D99414" />
      <stop offset="42%" stop-color="#FFE88A" />
      <stop offset="70%" stop-color="#F5B025" />
      <stop offset="90%" stop-color="#B87304" />
      <stop offset="100%" stop-color="#523200" />
    </linearGradient>

    <radialGradient id="clapperGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF2A8" />
      <stop offset="45%" stop-color="#E5A01A" />
      <stop offset="100%" stop-color="#5C3400" />
    </radialGradient>

    <radialGradient id="bellAmbientGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#FFA800" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Bell -->
  <circle cx="128" cy="220" r="110" fill="url(#bellAmbientGlow)" />

  <!-- Hanging Chain (from bow tip) -->
  <g id="chain">
    <!-- Bow attachment loop -->
    <ellipse cx="128" cy="18" rx="8" ry="10" fill="none" stroke="url(#chainGrad)" stroke-width="4.5" />
    <!-- Chain Links -->
    <ellipse cx="128" cy="38" rx="5" ry="9" fill="none" stroke="url(#chainGrad)" stroke-width="3.5" />
    <ellipse cx="128" cy="56" rx="5" ry="9" fill="none" stroke="url(#chainGrad)" stroke-width="3.5" />
    <ellipse cx="128" cy="74" rx="5" ry="9" fill="none" stroke="url(#chainGrad)" stroke-width="3.5" />
    <ellipse cx="128" cy="92" rx="5" ry="9" fill="none" stroke="url(#chainGrad)" stroke-width="3.5" />
    <ellipse cx="128" cy="110" rx="5" ry="9" fill="none" stroke="url(#chainGrad)" stroke-width="3.5" />
    <ellipse cx="128" cy="128" rx="5" ry="9" fill="none" stroke="url(#chainGrad)" stroke-width="3.5" />
  </g>

  <!-- Bell Top Cap Ring -->
  <ellipse cx="128" cy="144" rx="14" ry="16" fill="none" stroke="url(#chainGrad)" stroke-width="6" />
  <path d="M 116,155 L 140,155 L 144,166 L 112,166 Z" fill="url(#bellGrad)" />

  <!-- Clapper (Hanging Below Rim) -->
  <g id="clapper">
    <line x1="128" y1="260" x2="128" y2="295" stroke="#FFE082" stroke-width="4" stroke-linecap="round" />
    <!-- Clapper Ball Bead -->
    <circle cx="128" cy="302" r="14" fill="url(#clapperGrad)" stroke="#4A2B00" stroke-width="2" />
    <!-- Small Teardrop Accent at Clapper Tip -->
    <circle cx="128" cy="318" r="4" fill="#E5A01A" />
  </g>

  <!-- Bell Body (Temple / Villu Paatu Bell) -->
  <g id="bell-body">
    <!-- Upper Dome -->
    <path d="M 112,166 Q 128,162 144,166 L 148,182 Q 128,178 108,182 Z" fill="url(#bellGrad)" />

    <!-- Main Flaring Bell Flare (conical with curved waist) -->
    <path d="M 108,182 C 104,208 92,238 72,264 C 64,274 54,282 48,286 C 68,289 96,292 128,292 C 160,292 188,289 208,286 C 202,282 192,274 184,264 C 164,238 152,208 148,182 Z"
          fill="url(#bellGrad)" stroke="#4A2B00" stroke-width="2" />

    <!-- Subtle Lotus Petal / Ridge Line on Upper Body -->
    <path d="M 106,202 Q 128,194 150,202" fill="none" stroke="#FFECA0" stroke-width="3" stroke-linecap="round" />
    <path d="M 98,228 Q 128,218 158,228" fill="none" stroke="#FFECA0" stroke-width="2.5" stroke-linecap="round" />

    <!-- Mid-waist Ring Band -->
    <path d="M 88,250 Q 128,242 168,250" fill="none" stroke="#613900" stroke-width="3" />
    <path d="M 87,252 Q 128,244 169,252" fill="none" stroke="#FFE082" stroke-width="2" />

    <!-- Flared Striking Rim (Thick Lip) -->
    <path d="M 44,285 C 72,298 184,298 212,285 C 215,292 210,299 198,301 C 158,306 98,306 58,301 C 46,299 41,292 44,285 Z"
          fill="url(#bellGrad)" stroke="#3D2100" stroke-width="2" />
    
    <!-- Golden Rim Highlight -->
    <path d="M 58,293 C 92,301 164,301 198,293" fill="none" stroke="#FFF7C7" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
